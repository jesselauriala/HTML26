<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="javascript.js"></script>
</head>
<body>

<main class="sovellus">
    <h1 class="otsikko">Tehtävälista</h1>
    <p>Lisää päivän tehtävät</p>

    <form id="taskForm">
        <input
        type="text"
        id="taskInput"
        placeholder="Kirjotia uusi tehtävä..."/>
        <button type="submit">Lisää</button>
    </form>

<div class="filters">
    <button data-filter="all">Kaikki</button>
    <button data-filter="all">Aktiiviset</button>
    <button data-filter="all">Valmiit</button>
</div>

</main>


    
</body>
</html>
