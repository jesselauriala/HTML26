<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painikkeet</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Painikejärjestelmä ja lomakekortti</h1>

     <div class="buttons">
     <button class="button btn--primary" type="button">Primary</button>
     <button class="button btn--secondary" type="button" disabled>Secondary</button>
     </div>
 
<main class="pääsisältö">
        <form class="lomake">
            <fieldset class="fieldset">
                <legend class=register>Rekisteröitymislomake</legend>
            <label for="Nimi">Nimi</label>
            <input id="Nimi" name="nimi" type="text" minlength="4" maxlength="12" placeholder="Kirjoita etu- ja sukunimesi" required>
            
            <label for="email">Sähköposti</label>
            <input id="email" name="email" type="email" placeholder="esim. matti@esimerkki.fi" required>
            
            <label for="salasana">Salasana</label>
            <input id="salasana" name="salasana" type="password" minlength="8" placeholder="Vähintään 8 merkkiä" required>
            
            <label class="terms">
                <input id="ehdot" type="checkbox" name="ehdot" required>
                Hyväksyn ehdot
            </label>
            
            <button type="submit">Rekisteröidy</button>
            </fieldset>
        </form>


</main>

</body>
</html>
