<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<canvas id="piirtoalue" width="400" height="300"></canvas>  
  
<script>  
  const canvas = document.getElementById("piirtoalue");  
  const ctx = canvas.getContext("2d");  
    
  // (0, 0) - vasen yläkulma  
  ctx.fillStyle = "red";  
  ctx.fillRect(20, 30, 60, 60);  
    
  // (350, 250) - lähellä oikeaa alakulmaa  
  ctx.fillStyle = "blue";  
  ctx.fillRect(200, 100, 80, 50);  
    
  // Keskellä  
  ctx.fillStyle = "green";  
  ctx.fillRect(300, 200, 40, 60);  
</script>  



</body>
</html>
