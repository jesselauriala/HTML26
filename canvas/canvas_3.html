<!DOCTYPE html>

<body>
    
<!DOCTYPE html>  
<html>  
<head>  
  <title>Canvas-koko</title>  
  <style>  
    
    canvas {  
      width: 600px;  
      height: 400px;  
      border: 2px solid black;  
    }  
  </style>  
</head>  
<body>  
  <!-- Tämä asettaa todellisen resoluution -->  
  <canvas id="piirtoalue" width="300" height="200"></canvas>  
    
  <script>  
    const canvas = document.getElementById("piirtoalue");  
    const ctx = canvas.getContext("2d");  
      
    ctx.fillStyle = "green";  
    ctx.fillRect(50, 50, 100, 100);  
  </script>  
</body>  
</html>  




</body>
