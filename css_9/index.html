<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<style>

.btn {
    background-color: rgb(206, 206, 206);
    padding: 10px;
    border: 10px;

}

.btn:hover {
    background-color: rgb(153, 2, 2);
    color: rgb(224, 219, 219);
}

.btn:focus {
    background-color: rgb(78, 2, 2);
    color: rgb(6, 139, 228);
}

.button:active {
    background-color: rgb(6, 25, 134);
    transform: scale(0.97);
}

.btn:disabled {
  background-color: #aaa;
  cursor: not-allowed;
  opacity: 0.6;
}

</style>



<button class="btn">Click me</button>

</body>
</html>
