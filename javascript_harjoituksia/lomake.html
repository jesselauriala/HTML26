<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomake</title>
    <script src="harjoitus5.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
    <section class="yhteydenotto">
        <h2>Lomake</h2>
        <form class="lomake">
            <label for="nimi">Käyttäjänimi</label>
            <input id="Nimi" name="nimi" type="text" minlength="4" maxlength="12" required>

            <label for="email">Sähköposti</label>
            <input id="email" name="email" type="email" required>

            <label for="salasana">Salasana</label>
            <input id="salasana" name="salasana" type="password" required minlength="8">

            <label for="salasana-vahvistus">Vahvista salasana:</label>
            <input type="password" id="salasana-vahvistus" name="password-confirm" required>

            <input type="checkbox" name="ehdot" required>Hyväksyn ehdot
            <button class="laheta" type="submit">Lähetä</button>
        </form>
    </section>
</main>
    
</body>
</html>
